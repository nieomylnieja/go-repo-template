name: Release Drafter

on:
  push:
    branches:
      - main
  # pull_request event is required only for autolabeler
  # 'edited' event is required to account for initial invalid PR names
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  autolabeler:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@v7
        with:
          token: ${{ secrets.RELEASE_DRAFTER_TOKEN }}

  update_release_draft:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          token: ${{ secrets.RELEASE_DRAFTER_TOKEN }}
      - name: Add release notes to the draft
        run: .github/scripts/release-notes.bash ${{ steps.drafter.outputs.tag_name }}
